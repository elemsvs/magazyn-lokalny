name: Aktualizacja lokalnego asortymentu

on:
  schedule:
    - cron: "0 3 * * *"   # codziennie o 3:00 UTC (~5:00 latem / 4:00 zimą czasu PL)
  workflow_dispatch: {}    # pozwala też uruchomić ręcznie z zakładki Actions

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Zainstaluj zależności
        run: pip install requests

      - name: Wygeneruj plik lokalnego asortymentu
        run: python generate_local_inventory.py

      - name: Zapisz zmiany w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add local_inventory.txt
          git diff --quiet --cached || git commit -m "Automatyczna aktualizacja lokalnego asortymentu"
          git push
